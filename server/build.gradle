plugins {
	id 'java'
	id 'org.springframework.boot' version '3.5.16'
	id 'io.spring.dependency-management' version '1.1.7'
	id 'com.diffplug.spotless' version '7.0.4'
	id 'jacoco'
}

group = 'com.planbee'
version = '0.0.1-SNAPSHOT'
description = 'Planbee API'

java {
	sourceCompatibility = '21'
}

repositories {
	mavenCentral()
}

ext {
	springdocVersion = '2.8.6'
	archunitVersion = '1.4.1'
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-actuator'
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-oauth2-resource-server'
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-web'
	implementation 'org.flywaydb:flyway-core'
	implementation "org.springdoc:springdoc-openapi-starter-webmvc-ui:${springdocVersion}"

	// QueryDSL — 버전은 Spring Boot BOM 이 관리한다 (querydsl-bom, 3.5.16 기준 5.1.0).
	// Spring Boot 3.x 는 Jakarta EE 9+ 이므로 반드시 `jakarta` classifier 를 쓴다.
	// (classifier 없는 아티팩트는 javax.persistence 를 참조해 컴파일되지 않는다)
	implementation 'com.querydsl:querydsl-jpa::jakarta'
	annotationProcessor 'com.querydsl:querydsl-apt::jakarta'
	annotationProcessor 'jakarta.annotation:jakarta.annotation-api'
	annotationProcessor 'jakarta.persistence:jakarta.persistence-api'

	runtimeOnly 'org.flywaydb:flyway-database-postgresql'
	runtimeOnly 'org.postgresql:postgresql'

	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testImplementation 'org.springframework.boot:spring-boot-testcontainers'
	testImplementation 'org.testcontainers:junit-jupiter'
	testImplementation 'org.testcontainers:postgresql'
	testImplementation 'io.rest-assured:rest-assured'
	testImplementation 'org.springframework.security:spring-security-test'
	testImplementation "com.tngtech.archunit:archunit-junit5:${archunitVersion}"
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

// 테스트는 .env 에 의존하지 않는다. 아래 값은 테스트 전용이며 다른 곳에서 재사용하지 않는다.
// (DB 접속 정보는 @IntegrationTest 의 Testcontainers 가 런타임에 덮어쓴다 — 여기서는
//  application.properties 의 플레이스홀더 해석만 통과시키는 용도다.)
tasks.withType(Test).configureEach {
	environment 'JWT_SECRET', 'test-only-signing-key-never-used-outside-tests'
	environment 'DB_URL', 'jdbc:postgresql://localhost:5432/planbee'
	environment 'DB_USERNAME', 'test'
	environment 'DB_PASSWORD', 'test'
}

// 기본 test 는 Docker 없이 도는 것만 실행한다 (슬라이스 테스트 + ArchUnit).
// DB가 필요한 테스트는 @IntegrationTest 로 태깅해 integrationTest 태스크로 분리한다.
tasks.named('test') {
	useJUnitPlatform {
		excludeTags 'integration'
	}
	finalizedBy tasks.named('jacocoTestReport')
}

tasks.register('integrationTest', Test) {
	description = 'Testcontainers 기반 통합 테스트 (Docker 필요)'
	group = 'verification'
	testClassesDirs = sourceSets.test.output.classesDirs
	classpath = sourceSets.test.runtimeClasspath
	useJUnitPlatform {
		includeTags 'integration'
	}
	shouldRunAfter tasks.named('test')
}

tasks.named('jacocoTestReport') {
	dependsOn tasks.named('test')
}

// 전체 포매터는 아직 도입하지 않는다 (기존 코드 스타일 유지).
// 결정론적으로 정리 가능한 항목만 강제한다. docs/conventions/server.md S-13 참조.
spotless {
	java {
		target 'src/**/*.java'
		removeUnusedImports()
		importOrder('java', 'javax', 'jakarta', 'org', 'com', '')
		trimTrailingWhitespace()
		endWithNewline()
	}
}
