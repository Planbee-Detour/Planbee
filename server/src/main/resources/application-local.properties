# 로컬 개발 프로필. `SPRING_PROFILES_ACTIVE=local` 로 활성화한다.
#
# DB 는 기본 application.properties 의 DB_URL / DB_USERNAME / DB_PASSWORD 를 그대로 쓴다
# (루트 .env — `make db-up` 으로 띄운 로컬 Postgres).
# 프로필을 지정하지 않고 실행해도 같은 값이 쓰인다. 이 파일은 "로컬은 DB_* 를 읽는다" 를
# 명시적으로 남겨 prod 와 대칭을 이루게 하는 것이 목적이다.

logging.level.com.planbee=DEBUG
