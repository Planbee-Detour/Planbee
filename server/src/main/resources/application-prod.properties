# 배포 프로필. `SPRING_PROFILES_ACTIVE=prod` 로 활성화한다.
#
# DB 만 로컬과 다른 환경 변수를 읽는다 — 이름을 PRD_ 로 갈라 두면
# 프로필을 지정하지 않은 실행이 배포 DB 에 붙는 사고가 구조적으로 막힌다.
# 값은 여기 적지 않는다 (common.md C-4). 배포 환경의 시크릿 저장소에서 주입한다.
spring.datasource.url=${PRD_DB_URL}
spring.datasource.username=${PRD_DB_USERNAME}
spring.datasource.password=${PRD_DB_PASSWORD}

# 시드(db/seed)는 절대 포함하지 않는다 — V901·V902 에 고정 비밀번호의 테스트 계정이 있다.
# 기본값과 같지만, e2e 프로필이 이 줄을 덮어쓰는 사고를 막기 위해 명시한다.
spring.flyway.locations=classpath:db/migration

logging.level.com.planbee=INFO
