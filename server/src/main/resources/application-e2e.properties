# 통합(E2E) 테스트 프로필. `make e2e-up` 이 SPRING_PROFILES_ACTIVE=e2e 로 기동한다.
#
# 시드 데이터를 마이그레이션과 같은 방식으로 적용해, 적용 순서와 재현성을 보장한다.
# 시드는 db/seed 아래에만 두고 V900 이상 번호를 쓴다 (실제 스키마 마이그레이션과 충돌 방지).
spring.flyway.locations=classpath:db/migration,classpath:db/seed

# E2E 는 결정론적이어야 하므로 로그를 넉넉히 남긴다. 실패 시 `make logs` 로 원인을 판별한다.
logging.level.com.planbee=DEBUG
