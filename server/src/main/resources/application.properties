spring.application.name=planbee-api
server.port=${SERVER_PORT:8080}
management.endpoints.web.exposure.include=health,info

# ─────────────────────────────────────────────────────────────────────
# 값은 환경 변수로만 주입한다. 이 파일에 실제 값을 적지 않는다. (common.md C-4)
# 로컬: 루트 .env  (`make env` 로 생성, git 에 커밋되지 않음)
# 배포: 배포 환경의 시크릿 저장소
# 기본값을 두지 않으므로, 변수가 없으면 기동 시점에 즉시 실패한다 — 조용히 잘못된 값으로 뜨는 것보다 낫다.
# ─────────────────────────────────────────────────────────────────────

# ── 데이터베이스 (PostgreSQL) ────────────────────────────────────────
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# 스키마의 소유자는 Flyway 다. Hibernate 는 검증만 한다. (server.md S-14)
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# ── 인증 (이메일 + 비밀번호, 자체 발급 JWT / HS256) ──────────────────
planbee.security.jwt.secret=${JWT_SECRET}
planbee.security.jwt.access-token-ttl=30m
planbee.security.jwt.refresh-token-ttl=14d

# ── API 문서 ─────────────────────────────────────────────────────────
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
