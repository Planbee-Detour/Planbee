spring.application.name=planbee-api
server.port=${SERVER_PORT:8080}
management.endpoints.web.exposure.include=health,info

# ─────────────────────────────────────────────────────────────────────
# 값은 환경 변수로만 주입한다. 이 파일에 실제 값을 적지 않는다. (common.md C-4)
# 로컬: 루트 .env  (`make env` 로 생성, git 에 커밋되지 않음)
# 배포: 배포 환경의 시크릿 저장소
# 기본값을 두지 않으므로, 변수가 없으면 기동 시점에 즉시 실패한다 — 조용히 잘못된 값으로 뜨는 것보다 낫다.
# ─────────────────────────────────────────────────────────────────────

# ── 데이터베이스 (PostgreSQL) ────────────────────────────────────────
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# 스키마의 소유자는 Flyway 다. Hibernate 는 검증만 한다. (server.md S-14)
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# ── 인증 (이메일 + 비밀번호, 자체 발급 JWT / HS256) ──────────────────
planbee.security.jwt.secret=${JWT_SECRET}
planbee.security.jwt.access-token-ttl=30m
planbee.security.jwt.refresh-token-ttl=14d

# ── API 문서 ─────────────────────────────────────────────────────────
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# ── 직렬화 표기 (common.md C-7 / server.md S-21) ─────────────────────
# Java 식별자는 camelCase 를 유지하고, 표기 변환은 여기 한 곳에서만 한다.
# DTO 마다 @JsonProperty 를 손으로 붙이면 빠뜨린 필드에서 두 표기가 섞인다.
spring.jackson.property-naming-strategy=SNAKE_CASE

# ── 인증 정책 (auth) ─────────────────────────────────────────────────
# 수치의 근거는 docs/features/auth/PRD.md 제약 절과 contract.yaml 에 있다.
# 문구에 수치를 박지 않으므로(design.md §4.7) 여기를 바꿔도 화면 문구는 그대로다.
planbee.auth.login-lock.max-attempts=5
planbee.auth.login-lock.window=10m
planbee.auth.login-lock.duration=10m
planbee.auth.refresh-grace-window=10s
planbee.auth.deletion-token-ttl=10m
planbee.auth.signup-rate-limit.max-attempts=10
planbee.auth.signup-rate-limit.window=1h

# 문의 주소는 **비어 있는 것이 정상 동작**이다 (auth AC-43·AC-44) — 그래서 이 설정만
# 예외적으로 빈 기본값을 둔다. 다른 변수처럼 기동을 실패시키면 안 된다. (common.md C-4 예외)
planbee.auth.support-contact-email=${SUPPORT_CONTACT_EMAIL:}

# ── 장소 (place — 한국관광공사 TourAPI) ─────────────────────────────
# serviceKey 는 디코딩(일반) 키를 넣는다 (TourApiProperties 참조).
planbee.place.tour.service-key=${TOUR_API_KEY}
planbee.place.tour.connect-timeout=2s
planbee.place.tour.read-timeout=4s

# TourAPI 응답 캐시 — 같은 좌표·필터의 반복 조회로 외부 쿼터를 소모하지 않는다.
spring.cache.type=caffeine
spring.cache.caffeine.spec=maximumSize=2000,expireAfterWrite=10m

# ── 관리자 알림 (admin-user-approval — Discord Incoming Webhook) ─────
# **비어 있는 것이 정상 동작이다** (AC-29) — 값이 없으면 발송을 건너뛰고 서버는 정상 기동한다.
# 그래서 이 설정만 예외적으로 빈 기본값을 두고 RequiredEnvironmentCheck 에 넣지 않는다
# (server.md S-28 예외). 값은 시크릿이므로 여기 적지 않는다 (common.md C-4).
planbee.admin.discord.webhook-url=${DISCORD_WEBHOOK_URL:}
planbee.admin.discord.connect-timeout=2s
planbee.admin.discord.read-timeout=4s
