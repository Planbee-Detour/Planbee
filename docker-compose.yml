services:
  db:
    image: postgres:17-alpine
    container_name: planbee-db
    # 값은 루트 .env 에서 온다 (`make env`). 여기에 실제 값을 적지 않는다.
    environment:
      POSTGRES_DB: planbee
      POSTGRES_USER: ${DB_USERNAME:?DB_USERNAME 이 필요합니다. 'make env' 를 실행하세요.}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD 가 필요합니다. 'make env' 를 실행하세요.}
      TZ: UTC
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - planbee-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U planbee -d planbee"]
      interval: 5s
      timeout: 3s
      retries: 10

  # 통합 테스트용 API. `make e2e-up` 이 db 와 함께 띄운다.
  # 로컬 개발(`make db-up`)에서는 db 만 뜨고 API 는 호스트에서 bootRun 으로 실행한다.
  api:
    build:
      context: ./server
    container_name: planbee-api
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: e2e
      # 컨테이너 내부 네트워크 주소이므로 .env 의 DB_URL(호스트용)을 쓰지 않는다.
      DB_URL: jdbc:postgresql://db:5432/planbee
      DB_USERNAME: ${DB_USERNAME:?DB_USERNAME 이 필요합니다. 'make env' 를 실행하세요.}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD 가 필요합니다. 'make env' 를 실행하세요.}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET 이 필요합니다. 'make env' 를 실행하세요.}
      TZ: UTC
    ports:
      # 호스트 포트가 이미 쓰이고 있으면 API_PORT 로 바꾼다. (예: API_PORT=18080 make e2e-up)
      - "${API_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/api/v1/health"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 20s

volumes:
  planbee-db-data:
