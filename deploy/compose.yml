name: planbee-production
services:
  api:
    image: ${PLANBEE_IMAGE:?배포 이미지를 지정하세요}
    platform: linux/amd64
    env_file:
      # CI 구조 검사만 /dev/null을 사용한다. 실제 배포는 manage.sh가 .env로 고정한다.
      - path: ${PLANBEE_RUNTIME_ENV:-.env}
        format: raw
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./certs:/app/certs:ro
    restart: unless-stopped
    mem_limit: 700m
    stop_grace_period: 30s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--max-time", "5", "http://localhost:8080/actuator/health"]
      interval: 15s
      timeout: 6s
      retries: 10
      start_period: 90s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
