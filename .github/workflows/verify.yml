name: verify

# 로컬 게이트와 동일한 make 타깃을 CI 에서 그대로 실행한다.
# 우회 경로를 만들지 않는다 — 여기서 도는 것은 개발자가 `make verify` 로 도는 것과 같다.
# (E2E/Maestro 는 macOS 러너 + 시뮬레이터가 필요해 제외한다. `make test-e2e` 는 수동 유지.)

on:
  pull_request:
  push:
    branches: [develop]

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  mobile:
    name: verify-mobile
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - name: install mobile deps
        run: npm --prefix mobile ci
      - name: make verify-mobile
        run: make verify-mobile

  server:
    name: verify-server + contract-check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version-file: .java-version
          cache: gradle
      - name: make verify-server
        run: |
          chmod +x server/gradlew
          make verify-server
      - name: make contract-check
        run: make contract-check
