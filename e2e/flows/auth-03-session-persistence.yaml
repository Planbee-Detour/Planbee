# 인증 지속 — 앱을 껐다 켜도 로그인 상태가 유지되는가. **이 계층의 고유 항목이다.**
# 계약: POST /api/v1/auth/token/refresh 200 (TokenPair) · POST /api/v1/auth/logout 204
#       AC-18 · AC-20 · AC-22 · AC-26 · AC-27
#
# 아래 두 층에서는 이걸 증명할 수 없다:
#   - mobile-tester 는 API 를 msw 로 목킹하고 Keychain 도 목이라, "재시작 후에도 남는가" 는
#     목이 남기기로 한 값을 다시 읽는 것이 된다.
#   - server-tester 는 앱 프로세스를 모른다.
# 실제 프로세스 재시작 + 실제 Keychain + 실제 회전이 한꺼번에 걸리는 곳은 여기뿐이다.
#
# 뒷부분(로그아웃)은 그 반대 방향의 왕복이다 — 지운 세션이 재시작 뒤에도 지워진 채인가.
#
# Maestro 2.x 문법: `assertVisible` 에서 `timeout` 이 제거됐다 (2.10.0 에서 파싱 실패).
# 그래서 "뜰 때까지 기다리는" 단언은 `extendedWaitUntil` + `visible:` 로 쓴다 (2026-09-02).
# `assertNotVisible` 과 timeout 없는 `assertVisible` 은 "지금 그러해야 한다" 는 단언이라 그대로 둔다.
# 2026-09-06 develop 머지 — 로그인 후 도착지가 자리표시자 홈에서 실제 홈(하단 탭 4개)으로 바뀌었다.
# 계정 설정은 마이 탭 안의 항목이 됐다: 홈 도착 판정은 탭바(`tab-My`)로 하고,
# 설정으로 갈 때 마이 탭을 먼저 누른다. `home-settings` testID 자체는 그 항목이 물려받았다.
appId: org.reactjs.native.example.Planbee
name: 인증 지속 (재시작) → 로그아웃
---
- clearKeychain
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible:
      id: 'login-submit'
    timeout: 15000

# 로그인 — 셀렉터의 근거는 auth-02-login-home.yaml 의 주석에 있다 (defects.md D-E1).
# 하위 플로우로 빼지 않고 그대로 두었다. `maestro test e2e/flows` 가 디렉토리의 yaml 을
# 전부 실행하므로, 공유용 조각을 같은 폴더에 두면 그것까지 독립 플로우로 돌아간다.
- tapOn: 'name@example.com'
- inputText: 'approved@e2e.planbee.test'
- tapOn:
    text: '비밀번호'
    index: 1
- inputText: 'planbee2026'
- hideKeyboard
- tapOn:
    id: 'login-submit'
# iOS "암호를 저장하겠습니까?" 다이얼로그는 매번 뜨지는 않지만 뜨면 그 아래 앱 화면이
# 접근성 트리에서 사라진다. 근거와 셀렉터의 출처는 `auth-02-login-home.yaml` 의 같은 블록.
- retry:
    maxRetries: 3
    commands:
      - tapOn:
          text: '지금 안 함'
          optional: true
      - extendedWaitUntil:
          visible:
            id: 'tab-My'
          timeout: 10000

# ── 재시작 ──────────────────────────────────────────────────────────
# clearState 를 주지 않는다. 토큰은 Keychain 에 있으므로 앱 데이터를 지우지 않는 한 남는다 (AC-18).
# 재시작하면 스플래시가 저장된 리프레시 토큰으로 POST /auth/token/refresh 를 부르고,
# 성공하면 **로그인 화면을 거치지 않고** 홈으로 간다 (AC-20).
# 이때 서버는 토큰을 회전시킨다 — 앱은 새 쌍을 받아 다시 저장한다 (AC-22).
- launchApp

- extendedWaitUntil:
    visible:
      id: 'tab-My'
    timeout: 20000
# 중간에 로그인 화면이 남아 있으면 세션 복원이 아니라 재로그인이다.
- assertNotVisible:
    id: 'login-submit'

# ── 로그아웃 (AC-26 · AC-27) ────────────────────────────────────────
# 탭을 누르기 전에 RN LogBox 알림 배너를 치운다 — 배너([10,787][392,835])가 `tab-My`
# ([310,776][359,818])의 중심을 덮어 탭이 먹힌다. 근거는 auth-01 의 같은 블록 주석.
- runFlow:
    when:
      visible:
        text: '.*Open debugger to view warnings.*'
    commands:
      - tapOn:
          point: '96%,93%'
      - waitForAnimationToEnd:
          timeout: 3000
- tapOn:
    id: 'tab-My'
- extendedWaitUntil:
    visible:
      id: 'home-settings'
    timeout: 15000
- tapOn:
    id: 'home-settings'
- extendedWaitUntil:
    visible:
      id: 'settings-logout'
    timeout: 15000
- tapOn:
    id: 'settings-logout'

# ── 네이티브 경고창의 확인 버튼을 어떻게 짚는가 ──────────────────────────────
# 이 화면에는 `로그아웃` 이라는 **문자열이 두 군데** 있다:
#   설정 화면의 행 `settings-logout`  [18,526][383,582]
#   경고창의 확인 버튼                 [205,463][345,511]
# (`로그아웃할까요?` 는 Maestro 의 text 매칭이 부분 일치가 아니라 정규식 전체 일치라
#  `로그아웃` 셀렉터에 걸리지 않는다.)
#
# 예전에는 `index: 1` 로 갈랐는데 **틀린 쪽을 눌렀다** (2026-09-07). Maestro 는 매칭된
# 요소를 계층 순서가 아니라 **화면 위치(y 오름차순)로 정렬**해서 index 를 매긴다 —
# 경고창 버튼(y 463)이 0, 설정 행(y 526)이 1이다. 그래서 index 1 은 경고창 뒤에 깔린
# 설정 행을 눌렀고, 경고창은 열린 채 남아 다음 단언이 실패했다. 실행 로그에 그대로 남아 있다:
#   `Tap on "로그아웃", Index: 1` → `Tapping on element: ... resource-id=settings-logout`
#
# index 를 0 으로 뒤집으면 지금은 통과하지만, 설정 화면이 스크롤되거나 항목이 늘어 행이
# 경고창 버튼보다 위로 올라오면 다시 조용히 뒤집힌다. 그래서 위치 순서가 아니라
# **경고창 자체의 구조**로 짚는다 — 확인 버튼은 항상 `취소` 버튼의 오른쪽 짝이다.
# ([57,463][197,511] 취소 / [205,463][345,511] 로그아웃 — 같은 행, 오른쪽.)
# 설정 행은 취소 버튼과 세로로 겹치지 않아 `rightOf` 에 걸리지 않는다.
# 앱에 경고창 버튼용 testID 를 달 수 있으면 그게 제일 좋다 — `defects.md` D-E1 에 요청으로 남겼다.
#
# 참고: 이때 화면 위쪽에 Metro 의 파란 `Refreshing...` 배너([10,70][392,84])가 떠 있을 수
# 있다. 레이아웃을 아래로 밀어 좌표·인덱스 기반 셀렉터를 흔들기 때문에, 이 플로우는
# 좌표와 index 를 쓰지 않는 쪽으로 정리했다.
- assertVisible: '로그아웃할까요?'
- tapOn:
    text: '로그아웃'
    rightOf:
      text: '취소'

# 로그인 화면으로 돌아온다. 완료 토스트("로그아웃했어요")는 2초 뒤 사라지는 표시라
# 단언하지 않는다 — 타이밍에 걸리는 단언은 이 계층에 두지 않는다.
- extendedWaitUntil:
    visible:
      id: 'login-submit'
    timeout: 15000

# ── 다시 재시작 ────────────────────────────────────────────────────
# 로그아웃은 기기의 토큰을 지우고(AC-27) 서버의 그 토큰도 폐기한다(AC-26).
# 그러므로 재시작해도 복원될 세션이 없어야 한다. 여기서 홈이 뜨면 둘 중 하나가 안 된 것이다.
- launchApp
- extendedWaitUntil:
    visible:
      id: 'login-submit'
    timeout: 20000
- assertNotVisible:
    id: 'tab-My'
