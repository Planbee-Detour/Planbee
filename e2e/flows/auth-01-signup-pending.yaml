# 가입 신청 해피패스 — 폼 제출 → 서버가 계정을 PENDING 으로 만들고 → 검토 중 안내 화면.
# 계약: POST /api/v1/auth/signup 201 (AccountStatusView) / AC-1 · AC-46
#
# 이 플로우가 통과한다는 것은:
#   앱이 만든 요청이 계약대로 받아들여지고(consents 3종 + age_over_14_confirmed),
#   **서버가 완성해 내려준 문구**가 화면에 그대로 그려진다는 뜻이다 (C-8 / AC-46).
#   아래 제목·본문·강조 카드는 앱 어디에도 하드코딩돼 있지 않다 — 앱이 문구를 만들면
#   이 단언은 통과하겠지만 서버 응답이 비어도 통과하게 되므로, 그때는 계약 위반이다.
#
# 다루지 않는 것: 중복 이메일(409) · 검증 실패(400) · 레이트 리밋(429) · 필드별 오류 표시.
# 전부 server-tester / mobile-tester 의 층이다 (절대규칙 5).
#
# Maestro 2.x 문법: `assertVisible` 에서 `timeout` 이 제거됐다 (2.10.0 에서 파싱 실패).
# 그래서 "뜰 때까지 기다리는" 단언은 `extendedWaitUntil` + `visible:` 로 쓴다 (2026-09-02).
# `assertNotVisible` 과 timeout 없는 `assertVisible` 은 "지금 그러해야 한다" 는 단언이라 그대로 둔다.
appId: org.reactjs.native.example.Planbee
name: 가입 신청 → 검토 중 안내
---
# 매 실행 새 이메일을 쓴다. 시드에 PENDING 계정을 두지 않는 이유이기도 하다 —
# 같은 이메일로 두 번 신청하면 409(AC-2)라서 두 번째 실행부터 플로우가 깨진다.
# 결정론이 필요한 것은 **결과**이지 입력 문자열이 아니다.
- evalScript: ${output.email = 'e2e-signup-' + Date.now() + '@e2e.planbee.test'}

- clearKeychain
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible:
      id: 'login-submit'
    timeout: 15000

- tapOn: '가입 신청하기'
# NavBar 는 "가입 신청", 본문 H1 은 "Planbee 가입 신청" 으로 다른 문장이다 (design.md §5.2).
- assertVisible: 'Planbee 가입 신청'

# 두 입력 모두 `retry` 로 감싸고 **들어간 값을 눈으로 확인한다.**
# `inputText` 는 COMPLETED 를 내고도 글자를 흘린다 — 비밀번호에 11자를 넣었는데 1자만 남아
# "영문과 숫자를 포함해 8자 이상" 오류로 제출이 막힌 적이 있다 (2026-09-02, iOS 26.5).
# `eraseText` 를 먼저 넣는 것은 재시도가 기존 글자에 덧쓰지 않게 하기 위함이다.
- retry:
    maxRetries: 3
    commands:
      - tapOn:
          id: 'signup-email'
      - eraseText
      - inputText: ${output.email}
      - assertVisible:
          id: 'signup-email'
          text: ${output.email}

# 시드 계정과 같은 테스트 전용 값. 계약의 password 정책(영문+숫자 8자 이상)을 만족한다.
# 마스킹돼 보이므로 `planbee2026`(11자)만큼의 점이 찍혔는지로 확인한다.
#
# ── iOS 자동 암호 제안 시트를 먼저 닫아야 한다 ──────────────────────────────
# 비밀번호 칸을 탭하면 iOS 가 "강력한 암호를 사용하겠습니까?" 시트를 화면 하단에 띄운다.
# 앱이 이 칸에 `newPassword` 를 지정했기 때문이고, **실제 사용자에게도 뜨는 정상 동작이다.**
# 문제는 그 시트가 키보드를 덮어 입력을 가로챈다는 것이다 — `inputText` 는 COMPLETED 를 내지만
# 실제로는 첫 글자 하나만 들어가고, "영문과 숫자를 포함해 8자 이상" 오류로 제출이 막힌다.
# 이것이 2026-09-02 에 이 플로우가 계속 실패하던 진짜 원인이었다.
#
# 시트는 **시스템 UI 라 앱 hierarchy 에 나타나지 않아** id 나 text 로 잡을 수 없다.
# `maestro hierarchy` 에도 안 보이고, 시뮬레이터의 `AutoFillPasswords` 를 꺼도 계속 떴다.
# 그래서 닫기(X) 버튼을 화면 비율 좌표로 누른다. 비율이라 기기 크기가 달라져도 따라간다.
- tapOn:
    id: 'signup-password'
- tapOn:
    point: '91%,58%'
- retry:
    maxRetries: 3
    commands:
      - tapOn:
          id: 'signup-password'
      - eraseText
      - inputText: 'planbee2026'
      - assertVisible:
          id: 'signup-password'
          text: '•••••••••••'
# 키보드를 반드시 내린다. 떠 있으면 화면 아래쪽 절반이 키보드에 가려서, 그 아래 요소를
# 탭해도 탭이 키보드에 막힌다 — Maestro 는 요소를 찾아 COMPLETED 를 내지만 앱에는 닿지 않는다.
# 동의 체크가 켜지지 않던 원인이 이것이었다 (2026-09-02).
#
# `hideKeyboard` 는 iOS 26.5 시뮬레이터에서 "Couldn't hide the keyboard" 로 실패하므로
# 빈 영역(본문 H1)을 눌러 포커스를 푼다.
- tapOn: 'Planbee 가입 신청'

# 가입 사유는 선택 항목이라 비워 둔다 — 비어 있어도 접수되는 것이 정상이다 (AC-7 / PRD 제약).
# 앱은 이때 signup_reason 을 null 로 보낸다.

# 필수 동의 3건 (AC-6). 마케팅(선택)은 **거부**한다 — 거부 이력도 함께 저장된다 (AC-8).
#
# 개별 체크가 아니라 "전체 동의" 로 켠 뒤 마케팅만 끈다. 결과 상태(필수 3건 동의 + 마케팅 거부)는
# 개별 체크와 같고, 서버로 가는 consents 페이로드도 같다.
#
# 개별 탭을 쓰지 않는 이유 (2026-09-02 실측):
#   `scrollUntilVisible` 직후 `consent-terms` · `consent-privacy` 를 탭하면 Maestro 는 COMPLETED 를
#   내지만 체크가 켜지지 않는다. `consent-age` 만 켜진 채 제출 버튼이 비활성으로 남아 플로우가 죽었다.
#   재현율 100% 이고, `waitForAnimationToEnd` 를 넣어도 같았다. 반면 같은 요소를 **단독 플로우로**
#   탭하면 정상 동작한다 — 즉 요소·터치 영역의 문제가 아니라 스크롤 직후 좌표 계산의 문제로 보인다.
#   terms·privacy 만 실패하고 age 는 성공하는 차이는 앞의 둘에만 우측 "보기" 버튼(`-view`)이 있어
#   행의 bounds 가 좁다(→333)는 점과 맞물린 것으로 의심되나 확정하지 못했다.
#   `consent-all` 과 `consent-marketing` 은 "보기" 가 없어 행 전체가 하나이고, 스크롤 직후에도 정상이다.
#   관찰 기록은 `defects.md` D-E2 에 남겼다.
- scrollUntilVisible:
    element:
      id: 'consent-all'
    direction: DOWN
# `retry` 로 감싸는 이유는 위 주석의 "스크롤 직후 탭이 씹힌다" 때문이다.
# 탭한 뒤 체크 상태를 직접 확인하고, 반영되지 않았으면 다시 누른다.
- retry:
    maxRetries: 3
    commands:
      - tapOn:
          id: 'consent-all'
      - assertVisible:
          id: 'consent-all'
          text: 'checkbox, checked'
# 마케팅 행은 목록 맨 아래라 "전체 동의" 가 보이는 위치에서는 화면 밖이다. 먼저 끌어올린다.
- scrollUntilVisible:
    element:
      id: 'consent-marketing'
    direction: DOWN
- retry:
    maxRetries: 3
    commands:
      - tapOn:
          id: 'consent-marketing'
      - assertVisible:
          id: 'consent-marketing'
          text: 'checkbox, unchecked'

- scrollUntilVisible:
    element:
      id: 'signup-submit'
    direction: DOWN
# 제출은 `retry` 로 감싸지 않는다. 성공하면 화면이 갈아끼워져 `signup-submit` 자체가 사라지므로,
# 재시도가 "버튼을 찾을 수 없음" 으로 죽는다. 대신 전환을 넉넉히 기다린다.
#
# ── 아래 단언은 전부 서버 응답의 문자열이다 (account_status). 앱은 렌더만 한다 ──
- tapOn:
    id: 'signup-submit'

# 제출 직후 iOS 가 "암호를 저장하겠습니까?" 시스템 다이얼로그를 띄운다. 열려 있는 동안에는
# 그 아래 앱 화면의 어떤 요소도 Maestro 에 보이지 않는다.
# ("지금 안 함" 을 좌표로 누른다. 저장을 누르면 다음 실행의 자동완성에 영향을 준다.)
#
# 정정 (2026-09-07): 이 다이얼로그는 위쪽 "강력한 암호를 사용하겠습니까?" 시트와 달리
# **접근성 트리에 올라온다** — `지금 안 함` [57,513][197,561] / `저장` [205,513][345,561].
# 그래서 `auth-02-login-home.yaml` 은 좌표 대신 `tapOn: text: '지금 안 함'` 로 누른다.
# 여기 좌표를 그대로 두는 것은 이 위치에서 실제로 통과하는 것이 확인됐기 때문이고
# (2026-09-07 실행에서 이 단계는 통과했다), 통과하는 단계를 함께 갈아엎지 않기 위해서다.
# 이 줄이 흔들리기 시작하면 auth-02 와 같은 요소 셀렉터로 바꾼다.
- waitForAnimationToEnd:
    timeout: 5000
- tapOn:
    point: '31%,61%'
# 다이얼로그가 닫히는 동안에는 그 아래 앱 화면이 접근성 트리에 아예 나타나지 않는다
# (`maestro hierarchy` 가 상태바만 돌려준다). 전환이 끝나기를 기다린 뒤 단언한다.
- waitForAnimationToEnd:
    timeout: 5000

# 아래 문구는 전부 서버가 내려준 것이라 같은 응답에 함께 담겨 온다. 그래도 `extendedWaitUntil`
# 로 두는 것은 값이 늦게 오기 때문이 아니라, 위 전환이 덜 끝났을 때를 견디기 위해서다.
- extendedWaitUntil:
    visible:
      text: '가입 신청을 검토하고 있어요'
    timeout: 20000
- extendedWaitUntil:
    visible:
      text: '관리자가 신청 내용을 확인하고 있어요. 확인에는 시간이 조금 걸릴 수 있어요.'
    timeout: 10000
# 강조 카드는 앞뒤를 정규식으로 연다. 카드가 **하나의 접근성 요소로 묶여 있어서**
# (`AccountStatusScreen.tsx` 의 `accessibilityLabel={제목. 본문}`) 접근성 트리에는 제목과 본문이
# 합쳐진 문자열 하나로 올라온다. 카드를 한 덩어리로 읽어주는 것이 옳으므로 앱이 아니라
# 이쪽을 맞춘다. Maestro 의 text 매칭은 부분 일치가 아니라 정규식 전체 일치다.
- extendedWaitUntil:
    visible:
      text: '.*승인되면 다시 로그인해 주세요.*'
    timeout: 10000

# 왕복 일관성 — 방금 보낸 이메일이 서버를 거쳐 그대로 돌아와 화면에 있다.
# 계정 카드도 같은 이유로 라벨이 합쳐질 수 있어 정규식으로 연다.
- extendedWaitUntil:
    visible:
      text: '.*${output.email}.*'
    timeout: 10000

# ── RN LogBox 알림 배너가 이 버튼을 덮는다 (2026-09-07 실측) ─────────────────
# 개발 빌드(Metro 연결)에서 JS 경고가 한 건이라도 나면 RN 이 화면 맨 아래에 LogBox 알림
# 배너를 띄운다. 접근성 트리에는 `!, Open debugger to view warnings.` 라는 요소 하나로
# 올라오고, 실측 bounds 는 흰 알약이 [10,787][392,835] 였다.
# `status-go-login` 은 [17,767][384,819] 이라 **버튼의 중심 (200,793) 이 배너 안쪽**이다.
# Maestro 는 요소의 중심을 누르므로 탭이 배너에 먹히고 화면은 그대로 남는다 —
# 2026-09-07 실행에서 이 플로우가 죽은 진짜 원인이 이것이다. 로그에도 그대로 남아 있다:
#   `Try tapping at (200, 793)` → 이어지는 `id: login-submit is visible` 이 17초 뒤 실패.
#
# **앱의 Toast 가 아니다.** 실패 스크린샷 하단의 흰 띠를 LoginScreen 의 Toast
# (`mobile/src/shared/ui/Toast.tsx`)로 오해하기 쉬운데, 접근성 트리를 뜨면 위 LogBox
# 문자열이다. 로그인 화면은 아예 마운트되지 않았다. 앱/서버 결함이 아니라 개발 빌드에서만
# 뜨는 RN 개발 도구다 (릴리스 빌드에는 LogBox 자체가 없다).
#
# 배너의 닫기(X)에는 testID 도 accessibilityLabel 도 없다. RN 이 `id` prop(=nativeID)만
# 주는데 iOS 에서는 그게 accessibilityIdentifier 로 매핑되지 않는다
# (`node_modules/react-native/Libraries/LogBox/UI/LogBoxNotificationDismissButton.js`).
# 그래서 X 만 비율 좌표로 누른다. 실패 스크린샷의 픽셀을 직접 읽어 X 글리프의 중심을
# **(387.7, 811.3)pt = (96.4%, 92.8%)** 로 재었다 (배너 우측 끝 392pt 에서 4pt 안쪽).
# 닫기 버튼은 20x20 이라 (96%,93%) = (385.9, 812.8)pt 는 hitSlop 없이도 버튼 안이다.
# 설령 X 를 빗나가 배너 본문을 눌러도 결과는 같다 — RN 0.86 은 본문 탭에 DevTools 를
# 띄우면서 배너를 내리고, 그 아래 앱 화면은 그대로 남는다 (2026-09-07 실측).
#
# 배너가 없으면 이 블록은 통째로 건너뛴다. 경고가 나느냐 마느냐는 실행마다 달라서
# 무조건 좌표를 누르면 빈 화면을 눌러 부작용을 낼 수 있다.
- runFlow:
    when:
      visible:
        text: '.*Open debugger to view warnings.*'
    commands:
      - tapOn:
          point: '96%,93%'
      - waitForAnimationToEnd:
          timeout: 3000

# 뒤로가기로 폼에 돌아가지 않고 스택이 교체됐는지 (AC-1 / design.md §1.3).
# 화면 교체 + 로그인 화면 첫 렌더가 끝날 때까지 기다린다. timeout 없는 `assertVisible` 도
# 암묵적으로 기다리기는 하지만(실측 17초), 얼마나 기다리는지가 파일에 안 보이면
# 실패했을 때 "레이스인가 진짜 실패인가" 를 판별할 수 없다. 이 파일의 규약대로
# 기다리는 단언은 전부 `extendedWaitUntil` + `visible:` 로 쓴다.
- tapOn:
    id: 'status-go-login'
- extendedWaitUntil:
    visible:
      id: 'login-submit'
    timeout: 15000
