# 승인된 계정 로그인 해피패스 — 로그인 → 홈 → 설정에서 내 계정 조회.
# 계약: POST /api/v1/auth/login 200 (LoginResponse) · GET /api/v1/auth/me 200 (UserSummary)
#       AC-11 · AC-18 · AC-35
#
# 이 플로우가 통과한다는 것은 앱 번들 → 네이티브 → 네트워크 → 실제 API → 실제 PostgreSQL 까지
# 전 구간이 살아있다는 뜻이다. 예전 health 플로우가 하던 역할을 실제 기능으로 대체한 것이다.
#
# 계정은 시드에서 온다 — server/src/main/resources/db/seed/V901__e2e_seed_auth.sql
# 그 파일의 이메일·비밀번호를 바꾸면 여기도 같이 고친다 (e2e/README.md 시드 규약).
#
# 다루지 않는 것: 틀린 비밀번호(401) · 잠금(429) · PENDING/REJECTED/SUSPENDED 차단(403).
# 전부 server-tester / mobile-tester 의 층이다 (절대규칙 5).
#
# Maestro 2.x 문법: `assertVisible` 에서 `timeout` 이 제거됐다 (2.10.0 에서 파싱 실패).
# 그래서 "뜰 때까지 기다리는" 단언은 `extendedWaitUntil` + `visible:` 로 쓴다 (2026-09-02).
# `assertNotVisible` 과 timeout 없는 `assertVisible` 은 "지금 그러해야 한다" 는 단언이라 그대로 둔다.
# 2026-09-06 develop 머지 — 로그인 후 도착지가 자리표시자 홈에서 실제 홈(하단 탭 4개)으로 바뀌었다.
# 계정 설정은 마이 탭 안의 항목이 됐다: 홈 도착 판정은 탭바(`tab-My`)로 하고,
# 설정으로 갈 때 마이 탭을 먼저 누른다. `home-settings` testID 자체는 그 항목이 물려받았다.
appId: org.reactjs.native.example.Planbee
name: 로그인 → 홈
---
- clearKeychain
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible:
      id: 'login-submit'
    timeout: 15000

# 로그인 화면의 입력란에는 아직 testID 가 없다 (가입 화면에는 있다) — defects.md D-E1 참고.
# 이메일은 플레이스홀더로 잡는다. 라벨 "이메일" 은 Text 라서 눌러도 포커스가 가지 않는다.
- tapOn: 'name@example.com'
- inputText: 'approved@e2e.planbee.test'

# 비밀번호는 라벨 Text 와 입력란의 accessibilityLabel 이 같은 문자열이라 index 로 가른다.
# 0 = 라벨, 1 = 입력란(계층 순서). 첫 실행에서 순서가 다르면 여기를 뒤집는다.
- tapOn:
    text: '비밀번호'
    index: 1
- inputText: 'planbee2026'
- hideKeyboard

- tapOn:
    id: 'login-submit'

# ── iOS "암호를 저장하겠습니까?" 시스템 다이얼로그 ──────────────────────────────
# 제출 직후 iOS 가 암호 저장 여부를 묻는다. **실제 사용자에게도 뜨는 정상 동작이고**,
# 앱이나 서버의 결함이 아니다. 문제는 이게 떠 있는 동안 그 아래 앱 화면이 접근성 트리에
# 아예 올라오지 않는다는 것이다 — 2026-09-07 실행에서 홈이 완전히 그려져 있었는데도
# `tab-My is visible` 이 실패한 원인이 이것이다 (실패 시점 hierarchy 에 다이얼로그만 있었다).
# 같은 함정을 `auth-01-signup-pending.yaml` 이 이미 다루고 있다.
#
# **매번 뜨지는 않는다.** 같은 실행에서 auth-03 은 같은 계정으로 로그인하고도 뜨지 않았다.
# 그래서 좌표를 무조건 누르지 않는다 — 다이얼로그가 없을 때 빈 화면을 눌러 부작용을 낸다.
# 대신 다이얼로그의 "지금 안 함" 버튼을 **요소로** 잡고 `optional: true` 로 둔다.
# (auth-01 의 "강력한 암호를 사용하겠습니까?" 시트와 달리 이 다이얼로그는 접근성 트리에
#  올라온다 — 실측 bounds `지금 안 함` [57,513][197,561] / `저장` [205,513][345,561].
#  좌표(31%,61%)로도 눌리지만 요소 셀렉터가 기기 크기에 안 흔들려서 더 낫다.)
# "저장" 을 누르면 다음 실행의 자동완성에 영향을 주므로 반드시 "지금 안 함" 이다.
#
# `retry` 로 감싸는 이유는 **타이밍** 때문이다. 다이얼로그는 로그인 응답이 온 뒤에 뜨므로
# 첫 번째 `tapOn` 시점에는 아직 없을 수 있다. 그때는 tab-My 대기가 10초 뒤 실패하고,
# 두 번째 회차에서 이미 떠 있는 다이얼로그를 닫고 통과한다.
#
# 홈 도착 = 200 + 토큰 저장 + 스택 교체까지 성립했다는 뜻이다 (AC-11).
# 하단 탭바는 세션이 있을 때만 마운트된다 — 그것이 보이면 Main 스택으로 교체된 것이다.
- retry:
    maxRetries: 3
    commands:
      - tapOn:
          text: '지금 안 함'
          optional: true
      - extendedWaitUntil:
          visible:
            id: 'tab-My'
          timeout: 10000
# 로그인 화면으로 되돌아가 있지 않다.
- assertNotVisible:
    id: 'login-submit'

# 설정 화면은 GET /auth/me 로 계정 카드를 그린다 (C-8 — 화면 하나가 한 번의 호출로 완성된다).
# 여기 보이는 이메일은 앱이 기억한 입력값이 아니라 **서버가 DB 에서 읽어 내려준 값**이다.
#
# 탭 하나를 누르기 전에 RN LogBox 알림 배너를 치운다. 배너는 화면 맨 아래 [10,787][392,835]
# 에 뜨는데 `tab-My` 는 [310,776][359,818] 이라 **탭 아이콘의 중심 (334,797) 이 배너 안쪽**이다.
# 배너가 떠 있으면 탭이 배너에 먹힌다 (근거와 좌표의 출처는 auth-01 의 같은 블록 주석).
- runFlow:
    when:
      visible:
        text: '.*Open debugger to view warnings.*'
    commands:
      - tapOn:
          point: '96%,93%'
      - waitForAnimationToEnd:
          timeout: 3000
- tapOn:
    id: 'tab-My'
- extendedWaitUntil:
    visible:
      id: 'home-settings'
    timeout: 15000
- tapOn:
    id: 'home-settings'
- extendedWaitUntil:
    visible:
      id: 'settings-logout'
    timeout: 15000
- extendedWaitUntil:
    visible:
      text: 'approved@e2e.planbee.test'
    timeout: 15000
