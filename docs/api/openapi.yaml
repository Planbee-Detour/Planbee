openapi: 3.1.0

# ─────────────────────────────────────────────────────────────────────
# Planbee API 계약. 이 파일이 원본이며 구현보다 먼저 확정된다. (AGENTS.md 절대규칙 1)
#
# - 소유자: tech-lead. 다른 역할은 이 파일을 수정하지 않는다.
# - 모든 오류 응답은 아래 Problem 스키마를 $ref 로 재사용한다. (common.md C-1)
# - 새 엔드포인트를 추가하면 docs/api/error-codes.md 에 에러 코드도 함께 등록한다.
# - 모바일 타입은 `make contract-types` 로 이 파일에서 생성한다. 손으로 정의하지 않는다.
# ─────────────────────────────────────────────────────────────────────

info:
  title: Planbee API
  version: 0.1.0
  description: Planbee 서비스 API

servers:
  - url: http://localhost:8080
    description: 로컬 개발

security:
  - bearerAuth: []

paths:
  /api/v1/health:
    get:
      summary: 서비스 상태 확인
      operationId: getHealth
      tags: [health]
      security: []
      responses:
        '200':
          description: 정상
          content:
            application/json:
              schema:
                type: object
                required: [service, status, timestamp]
                properties:
                  service:
                    type: string
                    example: planbee-api
                  status:
                    type: string
                    example: UP
                  timestamp:
                    type: string
                    format: date-time

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    Problem:
      type: object
      description: RFC 9457 Problem Details. 모든 오류 응답의 형식.
      required: [status, code]
      properties:
        type:
          type: string
          default: about:blank
        title:
          type: string
          description: HTTP 상태 문구(영문). 사용자에게 표시하지 않는다.
          example: Not Found
        status:
          type: integer
          example: 404
        detail:
          type: string
          description: 사용자에게 표시할 한국어 문구.
          example: 일정을 찾을 수 없습니다.
        instance:
          type: string
          example: /api/v1/schedules/42
        code:
          type: string
          description: 모바일이 분기하는 기계용 식별자. docs/api/error-codes.md 참조.
          example: SCHEDULE_NOT_FOUND
        errors:
          type: array
          description: 검증 실패 시에만 포함된다.
          items:
            $ref: '#/components/schemas/FieldError'

    FieldError:
      type: object
      required: [field, code, message]
      properties:
        field:
          type: string
          example: title
        code:
          type: string
          example: NOT_BLANK
        message:
          type: string
          example: 제목을 입력하세요.

  responses:
    Problem:
      description: 오류
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
