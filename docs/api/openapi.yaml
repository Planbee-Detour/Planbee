openapi: 3.1.0

# ─────────────────────────────────────────────────────────────────────
# Planbee API 계약. 이 파일이 원본이며 구현보다 먼저 확정된다. (AGENTS.md 절대규칙 1)
#
# - 소유자: tech-lead. 다른 역할은 이 파일을 수정하지 않는다.
# - 모든 오류 응답은 아래 Problem 스키마를 $ref 로 재사용한다. (common.md C-1)
# - 새 엔드포인트를 추가하면 docs/api/error-codes.md 에 에러 코드도 함께 등록한다.
# - 모바일 타입은 `make contract-types` 로 이 파일에서 생성한다. 손으로 정의하지 않는다.
# ─────────────────────────────────────────────────────────────────────

info:
  title: Planbee API
  version: 0.1.0
  description: Planbee 서비스 API

servers:
  - url: http://localhost:8080
    description: 로컬 개발

security:
  - bearerAuth: []

paths:
  /api/v1/places/nearby:
    get:
      summary: 주변 장소 조회
      operationId: getNearbyPlaces
      tags: [place]
      security: []
      parameters:
        - {name: latitude, in: query, required: true, schema: {type: number, format: double}}
        - {name: longitude, in: query, required: true, schema: {type: number, format: double}}
      responses:
        '200':
          description: 주변 장소 목록
          content:
            application/json:
              schema: {$ref: '#/components/schemas/NearbyPlaceList'}
  /api/v1/places/{place_id}:
    get:
      summary: 관광지 상세 조회
      operationId: getPlaceDetail
      tags: [place]
      security: []
      parameters:
        - name: place_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: 관광지 상세
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlaceDetail'
        '404':
          $ref: '#/components/responses/Problem'
  /api/v1/health:
    get:
      summary: 서비스 상태 확인
      operationId: getHealth
      tags: [health]
      security: []
      responses:
        '200':
          description: 정상
          content:
            application/json:
              schema:
                type: object
                required: [service, status, timestamp]
                properties:
                  service:
                    type: string
                    example: planbee-api
                  status:
                    type: string
                    example: UP
                  timestamp:
                    type: string
                    format: date-time

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    NearbyPlaceList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/NearbyPlace'}
    NearbyPlace:
      type: object
      required: [place_id, category, status_label, name, distance_label, tags, latitude, longitude]
      properties:
        place_id: {type: string}
        category: {type: string}
        status_label: {type: string}
        name: {type: string}
        image_url: {type: [string, 'null'], format: uri}
        distance_label: {type: string}
        tags: {type: array, items: {type: string}}
        latitude: {type: number, format: double}
        longitude: {type: number, format: double}
    PlaceDetail:
      type: object
      required: [place_id, category, status_label, name, tags, source_label]
      properties:
        place_id: {type: string, example: mmca-seoul}
        category: {type: string, example: 역사 · 문화}
        status_label: {type: string, example: 운영 중}
        name: {type: string, example: 국립현대미술관 서울}
        image_url: {type: [string, 'null'], format: uri}
        address: {type: [string, 'null']}
        opening_hours: {type: [string, 'null']}
        distance_label: {type: [string, 'null']}
        tags: {type: array, items: {type: string}}
        description: {type: [string, 'null']}
        recommendation_reason: {type: [string, 'null']}
        latitude: {type: [number, 'null'], format: double}
        longitude: {type: [number, 'null'], format: double}
        source_label: {type: string, example: 한국관광공사 제공}
    Problem:
      type: object
      description: RFC 9457 Problem Details. 모든 오류 응답의 형식.
      required: [status, code]
      properties:
        type:
          type: string
          default: about:blank
        title:
          type: string
          description: HTTP 상태 문구(영문). 사용자에게 표시하지 않는다.
          example: Not Found
        status:
          type: integer
          example: 404
        detail:
          type: string
          description: 사용자에게 표시할 한국어 문구.
          example: 일정을 찾을 수 없습니다.
        instance:
          type: string
          example: /api/v1/schedules/42
        code:
          type: string
          description: 모바일이 분기하는 기계용 식별자. docs/api/error-codes.md 참조.
          example: SCHEDULE_NOT_FOUND
        errors:
          type: array
          description: 검증 실패 시에만 포함된다.
          items:
            $ref: '#/components/schemas/FieldError'

    FieldError:
      type: object
      required: [field, code, message]
      properties:
        field:
          type: string
          example: title
        code:
          type: string
          example: NOT_BLANK
        message:
          type: string
          example: 제목을 입력하세요.

  responses:
    Problem:
      description: 오류
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
