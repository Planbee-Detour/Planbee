openapi: 3.1.0
info:
  title: Planbee 장소 상세 계약
  version: 0.2.0

# 2026-09-08 개정 (tech-lead) — nearby-places 서버화와 함께 확정.
#
# place_id 는 `<source>:<id>` 다 (nearby-places/contract.yaml 참조).
#   - `kakao:<id>`  → 카카오 로컬 상세 + 이름·좌표로 TourAPI 매칭해 소개·이미지·운영시간 보강
#   - `tour:<contentid>` → TourAPI detailCommon/detailIntro
# source_label 은 실제로 쓴 소스를 밝힌다 ("카카오맵 제공" 또는 "한국관광공사 제공").
# status_label·tags 는 nullable 로 내린다 — 카카오 단독 결과에는 없다 (nearby 와 같은 이유).
# 인증: 공개(security: []).

paths:
  /api/v1/places/{place_id}:
    get:
      operationId: getPlaceDetail
      summary: 장소 상세 조회
      tags: [place]
      security: []
      x-acceptance-criteria: [AC-PD-1, AC-PD-2, AC-PD-3, AC-PD-4, AC-PD-5]
      parameters:
        - name: place_id
          in: path
          required: true
          description: '`<source>:<id>`. 주변 목록 응답의 `place_id` 를 그대로 되돌려 보낸다.'
          schema: {type: string, example: 'kakao:27285170'}
      responses:
        '200':
          description: 장소 상세. 없는 선택 필드는 `null` 이고 앱은 그 영역을 숨긴다 (AC-PD-3).
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PlaceDetail'}
        '400':
          description: '`place_id` 형식 오류 — `<source>:<id>` 가 아니다 (`MALFORMED_REQUEST`). 앱의 버그 신호.'
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/Problem'}
        '404':
          description: 해당 장소가 없거나 공개 상태가 아니다 (`PLACE_NOT_FOUND`). 앱은 "장소 정보를 찾을 수 없어요" (AC-PD-3 비어있음).
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/Problem'}
              example:
                type: about:blank
                title: Not Found
                status: 404
                detail: 장소가 삭제되었거나 현재 공개되지 않았어요.
                instance: /api/v1/places/kakao:0
                code: PLACE_NOT_FOUND
        '500':
          description: |
            카카오 또는 TourAPI 조회 실패 — 상류 5xx · 타임아웃 · 쿼터 초과
            (`PLACE_UPSTREAM_UNAVAILABLE`). C-1 이 502/503 을 허용하지 않아 상태는 500 이다.
            (`nearby-places/contract.yaml` 의 `PlaceUpstreamUnavailable` 과 같은 응답)
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/Problem'}

components:
  schemas:
    PlaceDetail:
      type: object
      required: [place_id, category, name, source_label]
      properties:
        place_id: {type: string, example: 'kakao:27285170'}
        category: {type: string, example: 역사 · 문화}
        status_label:
          type: [string, 'null']
          example: 운영 중
          description: TourAPI 매칭 시에만. 카카오 단독 결과는 `null`.
        name: {type: string, example: 경복궁}
        image_url: {type: [string, 'null'], format: uri}
        address: {type: [string, 'null']}
        opening_hours: {type: [string, 'null']}
        distance_label: {type: [string, 'null']}
        tags:
          type: [array, 'null']
          items: {type: string}
        description: {type: [string, 'null']}
        recommendation_reason: {type: [string, 'null']}
        latitude: {type: [number, 'null'], format: double}
        longitude: {type: [number, 'null'], format: double}
        source_label: {type: string, example: 한국관광공사 제공, description: 실제로 사용한 데이터 소스}
